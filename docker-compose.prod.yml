# ============================================
# Docker Compose - Production
# Despliegue en Dokploy
# ============================================

services:
  # ---- API (NestJS + Prisma) ----
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3000
      - FRONTEND_URL=${FRONTEND_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - APP_NAME=${APP_NAME}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME}
      - CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_R2_ACCOUNT_ID}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME}
      - CLOUDFLARE_R2_PUBLIC_URL=${CLOUDFLARE_R2_PUBLIC_URL}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - dokploy-network

  # ---- Events Portal (Astro SSR) ----
  events-portal:
    build:
      context: .
      dockerfile: apps/events-portal/Dockerfile.prod
      args:
        - PUBLIC_API_URL=${PUBLIC_API_URL}
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
    expose:
      - "4321"
    restart: unless-stopped
    networks:
      - dokploy-network

  # ---- Panel Admin (Vite SPA + Nginx) ----
  panel-admin:
    build:
      context: .
      dockerfile: apps/panel-admin/Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_COOKIE_SECRET=${VITE_COOKIE_SECRET}
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - dokploy-network

  # ---- Docs (Next.js) ----
  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile.prod
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
    expose:
      - "3002"
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
